<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>OpenLandscape - Pilota Territoriale</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #eee; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    
    .header-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(8px);
      padding: 10px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }
    .title { font-weight: 700; letter-spacing: 0.5px; color: #52B788; }
    .metrics-container { display: flex; gap: 10px; }
    .metric-badge { background: #1b4332; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; border: 1px solid #40916c; }
    .score-badge { background: #2D6A4F; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; }

    .toolbox {
      position: absolute; top: 80px; left: 12px;
      background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(8px);
      padding: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      z-index: 10; display: flex; flex-direction: column; gap: 8px; width: 190px;
    }
    .toolbox label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; margin-bottom: 4px; }
    .tool-btn {
      background: #222; border: 1px solid #444; color: #eee; padding: 10px;
      border-radius: 6px; text-align: left; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .tool-btn:hover { background: #333; border-color: #666; }
    .tool-btn.active { background: #2D6A4F; border-color: #52B788; color: #fff; }
    
    .action-divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0; }
    .export-btn {
      background: #1e3a5f; border: 1px solid #3a86ff; color: #fff; padding: 10px;
      border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.2s;
    }
    .export-btn:hover { background: #2563eb; }

    #cell-info {
      position: absolute; bottom: 24px; left: 12px;
      background: rgba(15, 15, 15, 0.95); padding: 12px 18px; border-radius: 8px;
      font-size: 13px; border: 1px solid #52B788; z-index: 20; color: #eee;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); min-width: 260px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title">OpenLandscape <span>// Pilota Territoriale</span></div>
    <div class="metrics-container">
      <div class="metric-badge" id="corridor-score">Corridoi: 0 link</div>
      <div class="score-badge" id="total-score">Bio-Punti: 0 PT</div>
    </div>
  </div>

  <div class="toolbox">
    <label>Azioni Progetto</label>
    <button class="tool-btn active" data-action="bosco">🌲 Bosco (+10)</button>
    <button class="tool-btn" data-action="umida">💧 Zona Umida (+15)</button>
    <button class="tool-btn" data-action="ciclabile">🚲 Ciclabile (+5)</button>
    <button class="tool-btn" data-action="reset">🔄 Ripristina</button>
    
    <div class="action-divider"></div>
    <label>Esportazione</label>
    <button class="export-btn" id="export-geojson-btn">📥 Salva GeoJSON per QGIS</button>
  </div>

  <div id="cell-info">Caricamento territorio...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    proj4.defs("EPSG:32632", "+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs");

    const SUPABASE_URL = "https://cpcocfjzbgiunhvphwwo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ATgwPpdPd-OGDmRCo4Gpng_3P5u-j5H";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeTool = "bosco";
    let cellsData = [];
    let initialZoomDone = false;

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTool = btn.dataset.action;
      });
    });

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [8.181, 45.564],
      zoom: 17
    });

    async function loadCells() {
      let allRows = [];
      const batchSize = 1000;
      const targetBatches = 20; // Carica 20.000 celle (50% del km²), fluido e veloce

      for (let i = 0; i < targetBatches; i++) {
        const from = i * batchSize;
        const to = from + batchSize - 1;
        const { data, error } = await dbClient
          .from('celle_territorio')
          .select('*')
          .range(from, to);

        if (error || !data || data.length === 0) break;
        allRows = allRows.concat(data);
        document.getElementById('cell-info').innerText = `Caricamento griglia: ${allRows.length} celle...`;
      }

      cellsData = allRows;
      renderCellsOnMap();
      updateMetrics();
      document.getElementById('cell-info').innerText = `Territorio pronto (${cellsData.length} celle).`;
    }

    function buildGeoJSON() {
      return {
        type: "FeatureCollection",
        features: cellsData.map(cell => {
          const x = parseFloat(cell.x_coord);
          const y = parseFloat(cell.y_coord);

          const p1 = proj4("EPSG:32632", "EPSG:4326", [x - 2.5, y - 2.5]);
          const p2 = proj4("EPSG:32632", "EPSG:4326", [x + 2.5, y - 2.5]);
          const p3 = proj4("EPSG:32632", "EPSG:4326", [x + 2.5, y + 2.5]);
          const p4 = proj4("EPSG:32632", "EPSG:4326", [x - 2.5, y + 2.5]);

          return {
            type: "Feature",
            properties: {
              id: cell.cell_id,
              stato: cell.stato_progetto || 'stato_di_fatto',
              eco_score: cell.eco_score || 0
            },
            geometry: {
              type: "Polygon",
              coordinates: [[p1, p2, p3, p4, p1]]
            }
          };
        })
      };
    }

    function renderCellsOnMap() {
      if (!cellsData || cellsData.length === 0) return;

      const geojsonData = buildGeoJSON();

      if (!initialZoomDone) {
        let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
        geojsonData.features.forEach(f => {
          const coords = f.geometry.coordinates[0];
          coords.forEach(c => {
            if (c[0] < minLon) minLon = c[0];
            if (c[0] > maxLon) maxLon = c[0];
            if (c[1] < minLat) minLat = c[1];
            if (c[1] > maxLat) maxLat = c[1];
          });
        });

        map.fitBounds([[minLon, minLat], [maxLon, maxLat]], {
          padding: 60,
          maxZoom: 18,
          duration: 0
        });
        initialZoomDone = true;
      }

      if (map.getSource('cells-source')) {
        map.getSource('cells-source').setData(geojsonData);
      } else {
        map.addSource('cells-source', { type: 'geojson', data: geojsonData });

        map.addLayer({
          id: 'cells-layer',
          type: 'fill',
          source: 'cells-source',
          paint: {
            'fill-color': [
              'match', ['get', 'stato'],
              'bosco', '#2D6A4F',
              'umida', '#2A9D8F',
              'ciclabile', '#DDA15E',
              '#2b2b2b'
            ],
            'fill-opacity': 0.65,
            'fill-outline-color': '#00ff88'
          }
        });

        map.on('mouseenter', 'cells-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'cells-layer', () => { map.getCanvas().style.cursor = ''; });

        map.on('click', 'cells-layer', async (e) => {
          const clickedFeature = e.features[0];
          const cellId = clickedFeature.properties.id;

          const coords = clickedFeature.geometry.coordinates[0];
          const screenPoints = coords.map(c => map.project(c));
          const xs = screenPoints.map(p => p.x);
          const ys = screenPoints.map(p => p.y);
          const bbox = [
            [Math.min(...xs), Math.min(...ys)],
            [Math.max(...xs), Math.max(...ys)]
          ];

          const featuresInCell = map.queryRenderedFeatures(bbox);
          const touchesBuilding = featuresInCell.some(f => {
            if (f.layer.id === 'cells-layer') return false;
            const layerId = (f.layer.id || '').toLowerCase();
            const sourceLayer = (f.sourceLayer || '').toLowerCase();
            return layerId.includes('building') || sourceLayer.includes('building');
          });

          if (touchesBuilding && activeTool !== 'reset') {
            document.getElementById('cell-info').innerHTML = `⚠️ <b>Cella ID: ${cellId}</b>: Interseca un edificio! Azione bloccata.`;
            return;
          }

          let newStatus = activeTool === 'reset' ? 'stato_di_fatto' : activeTool;
          let newScore = activeTool === 'bosco' ? 10 : (activeTool === 'umida' ? 15 : (activeTool === 'ciclabile' ? 5 : 0));

          document.getElementById('cell-info').innerHTML = `<b>Cella ID:</b> ${cellId} &nbsp;|&nbsp; <b>Stato:</b> ${newStatus}`;

          const localCell = cellsData.find(c => String(c.cell_id) === String(cellId));
          if (localCell) {
            localCell.stato_progetto = newStatus;
            localCell.eco_score = newScore;
          }

          map.getSource('cells-source').setData(buildGeoJSON());
          updateMetrics();

          await dbClient.from('celle_territorio')
            .update({ stato_progetto: newStatus, eco_score: newScore })
            .eq('cell_id', cellId);
        });
      }
    }

    function calculateConnectivity() {
      const forestCells = new Map();
      cellsData.forEach(c => {
        if (c.stato_progetto === 'bosco') {
          const key = `${Math.round(c.x_coord)},${Math.round(c.y_coord)}`;
          forestCells.set(key, true);
        }
      });

      let connections = 0;
      forestCells.forEach((_, key) => {
        const [x, y] = key.split(',').map(Number);
        if (forestCells.has(`${x + 5},${y}`)) connections++;
        if (forestCells.has(`${x},${y + 5}`)) connections++;
      });

      return connections;
    }

    function updateMetrics() {
      const baseScore = cellsData.reduce((acc, curr) => acc + (curr.eco_score || 0), 0);
      const corridorLinks = calculateConnectivity();
      const bonusScore = corridorLinks * 5;
      const finalScore = baseScore + bonusScore;

      document.getElementById('corridor-score').innerText = `Corridoi: ${corridorLinks} link (+${bonusScore} PT)`;
      document.getElementById('total-score').innerText = `Bio-Punti: ${finalScore} PT`;
    }

    // Esportazione diretta del file per QGIS
    document.getElementById('export-geojson-btn').addEventListener('click', () => {
      const geojsonData = buildGeoJSON();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geojsonData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "progetto_openlandscape.geojson");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    map.on('load', () => {
      loadCells();
    });
  </script>
</body>
</html>
