<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>OpenLandscape - Piattaforma Territoriale Collaborativa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #eee; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    
    .header-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(8px);
      padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }
    .title { font-weight: 700; letter-spacing: 0.5px; color: #52B788; }
    .metrics-container { display: flex; gap: 8px; }
    .metric-badge { background: #1b4332; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 12px; border: 1px solid #40916c; }
    .score-badge { background: #2D6A4F; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 12px; }
    .cost-badge { background: #1f2937; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 12px; border: 1px solid #4b5563; color: #93c5fd; }

    .toolbox {
      position: absolute; top: 76px; left: 12px;
      background: rgba(18, 18, 18, 0.92); backdrop-filter: blur(8px);
      padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      z-index: 10; display: flex; flex-direction: column; gap: 6px; width: 200px;
      max-height: calc(100vh - 150px); overflow-y: auto;
    }
    .toolbox label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; margin-top: 4px; margin-bottom: 2px; }
    .tool-btn {
      background: #222; border: 1px solid #444; color: #eee; padding: 8px 10px;
      border-radius: 6px; text-align: left; cursor: pointer; font-size: 12px;
      display: flex; align-items: center; justify-content: space-between; transition: all 0.2s;
    }
    .tool-btn:hover { background: #333; border-color: #666; }
    .tool-btn.active { background: #2D6A4F; border-color: #52B788; color: #fff; }
    
    .action-divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0; }
    .export-btn {
      background: #1e3a5f; border: 1px solid #3a86ff; color: #fff; padding: 8px;
      border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.2s;
    }
    .export-btn:hover { background: #2563eb; }

    #cell-info {
      position: absolute; bottom: 20px; left: 12px;
      background: rgba(15, 15, 15, 0.95); padding: 10px 14px; border-radius: 8px;
      font-size: 12px; border: 1px solid #52B788; z-index: 20; color: #eee;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); min-width: 250px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title">OpenLandscape <span>// Live Sync</span></div>
    <div class="metrics-container">
      <div class="cost-badge" id="total-cost">Costo: 0 €</div>
      <div class="metric-badge" id="corridor-score">Corridoi: 0 link</div>
      <div class="score-badge" id="total-score">Bio-Punti: 0 PT</div>
    </div>
  </div>

  <div class="toolbox">
    <label>Interventi NBS</label>
    <button class="tool-btn active" data-action="bosco">🌲 Bosco <span>+10</span></button>
    <button class="tool-btn" data-action="umida">💧 Zona Umida <span>+15</span></button>
    <button class="tool-btn" data-action="ripariale">🌿 Fascia Riparia <span>+12</span></button>
    <button class="tool-btn" data-action="prato">🌸 Prato Fiorito <span>+8</span></button>
    <button class="tool-btn" data-action="depav">🧱 De-pavimentaz. <span>+20</span></button>
    
    <label>Infrastrutture</label>
    <button class="tool-btn" data-action="ciclabile">🚲 Ciclabile <span>+5</span></button>
    <button class="tool-btn" data-action="reset">🔄 Ripristina <span>0</span></button>
    
    <div class="action-divider"></div>
    <label>Esportazione</label>
    <button class="export-btn" id="export-geojson-btn">📥 Salva GeoJSON (QGIS)</button>
  </div>

  <div id="cell-info">Connessione al territorio...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    proj4.defs("EPSG:32632", "+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs");

    const SUPABASE_URL = "https://cpcocfjzbgiunhvphwwo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ATgwPpdPd-OGDmRCo4Gpng_3P5u-j5H";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Parametri interventi: punti e costo indicativo per cella da 25 m² (5x5 m)
    const TOOL_SPECS = {
      bosco: { score: 10, costPerM2: 12, name: 'Bosco' },
      umida: { score: 15, costPerM2: 25, name: 'Zona Umida' },
      ripariale: { score: 12, costPerM2: 18, name: 'Fascia Riparia' },
      prato: { score: 8, costPerM2: 6, name: 'Prato Fiorito' },
      depav: { score: 20, costPerM2: 35, name: 'De-pavimentazione' },
      ciclabile: { score: 5, costPerM2: 40, name: 'Pista Ciclabile' },
      reset: { score: 0, costPerM2: 0, name: 'Stato di Fatto' }
    };

    let activeTool = "bosco";
    let cellsMap = new Map(); // Archivio rapido delle celle per id
    let initialZoomDone = false;
    let isFetching = false;

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTool = btn.dataset.action;
      });
    });

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [8.181, 45.564],
      zoom: 17
    });

    // Carica dinamicamente le celle visibili nel viewport
    async function fetchViewportCells() {
      if (isFetching) return;
      isFetching = true;

      const bounds = map.getBounds();
      const pMin = proj4("EPSG:4326", "EPSG:32632", [bounds.getWest(), bounds.getSouth()]);
      const pMax = proj4("EPSG:4326", "EPSG:32632", [bounds.getEast(), bounds.getNorth()]);

      const { data, error } = await dbClient
        .from('celle_territorio')
        .select('*')
        .gte('x_coord', pMin[0] - 10)
        .lte('x_coord', pMax[0] + 10)
        .gte('y_coord', pMin[1] - 10)
        .lte('y_coord', pMax[1] + 10)
        .limit(4000);

      isFetching = false;

      if (!error && data) {
        data.forEach(cell => cellsMap.set(String(cell.cell_id), cell));
        renderCells();
        updateMetrics();
      }
    }

    function buildGeoJSON() {
      const features = Array.from(cellsMap.values()).map(cell => {
        const x = parseFloat(cell.x_coord);
        const y = parseFloat(cell.y_coord);

        const p1 = proj4("EPSG:32632", "EPSG:4326", [x - 2.5, y - 2.5]);
        const p2 = proj4("EPSG:32632", "EPSG:4326", [x + 2.5, y - 2.5]);
        const p3 = proj4("EPSG:32632", "EPSG:4326", [x + 2.5, y + 2.5]);
        const p4 = proj4("EPSG:32632", "EPSG:4326", [x - 2.5, y + 2.5]);

        return {
          type: "Feature",
          properties: {
            id: cell.cell_id,
            stato: cell.stato_progetto || 'stato_di_fatto',
            eco_score: cell.eco_score || 0
          },
          geometry: {
            type: "Polygon",
            coordinates: [[p1, p2, p3, p4, p1]]
          }
        };
      });

      return { type: "FeatureCollection", features };
    }

    function renderCells() {
      const geojsonData = buildGeoJSON();

      if (!map.getSource('cells-source')) {
        map.addSource('cells-source', { type: 'geojson', data: geojsonData });

        map.addLayer({
          id: 'cells-layer',
          type: 'fill',
          source: 'cells-source',
          paint: {
            'fill-color': [
              'match', ['get', 'stato'],
              'bosco', '#2D6A4F',
              'umida', '#2A9D8F',
              'ripariale', '#40916C',
              'prato', '#B5E48C',
              'depav', '#52B788',
              'ciclabile', '#DDA15E',
              '#242424'
            ],
            'fill-opacity': 0.68,
            'fill-outline-color': 'rgba(0, 255, 136, 0.3)'
          }
        });

        map.on('mouseenter', 'cells-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'cells-layer', () => { map.getCanvas().style.cursor = ''; });

        map.on('click', 'cells-layer', async (e) => {
          const clickedFeature = e.features[0];
          const cellId = clickedFeature.properties.id;

          const coords = clickedFeature.geometry.coordinates[0];
          const screenPoints = coords.map(c => map.project(c));
          const xs = screenPoints.map(p => p.x);
          const ys = screenPoints.map(p => p.y);
          const bbox = [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];

          const featuresInCell = map.queryRenderedFeatures(bbox);
          const touchesBuilding = featuresInCell.some(f => {
            if (f.layer.id === 'cells-layer') return false;
            const lid = (f.layer.id || '').toLowerCase();
            const slid = (f.sourceLayer || '').toLowerCase();
            return lid.includes('building') || slid.includes('building');
          });

          if (touchesBuilding && activeTool !== 'reset') {
            document.getElementById('cell-info').innerHTML = `⚠️ <b>Cella ${cellId}</b>: Interseca un edificio vincolato.`;
            return;
          }

          const spec = TOOL_SPECS[activeTool];
          const newStatus = activeTool === 'reset' ? 'stato_di_fatto' : activeTool;
          const newScore = spec.score;

          // Aggiornamento locale immediato
          const target = cellsMap.get(String(cellId));
          if (target) {
            target.stato_progetto = newStatus;
            target.eco_score = newScore;
          }

          renderCells();
          updateMetrics();
          document.getElementById('cell-info').innerHTML = `<b>Cella:</b> ${cellId} | <b>Intervento:</b> ${spec.name}`;

          // Aggiornamento database cloud
          await dbClient.from('celle_territorio')
            .update({ stato_progetto: newStatus, eco_score: newScore })
            .eq('cell_id', cellId);
        });
      } else {
        map.getSource('cells-source').setData(geojsonData);
      }
    }

    function calculateConnectivity() {
      const forestKeys = new Set();
      cellsMap.forEach(c => {
        if (c.stato_progetto === 'bosco' || c.stato_progetto === 'ripariale') {
          forestKeys.add(`${Math.round(c.x_coord)},${Math.round(c.y_coord)}`);
        }
      });

      let links = 0;
      forestKeys.forEach(k => {
        const [x, y] = k.split(',').map(Number);
        if (forestKeys.has(`${x + 5},${y}`)) links++;
        if (forestKeys.has(`${x},${y + 5}`)) links++;
      });
      return links;
    }

    function updateMetrics() {
      let baseScore = 0;
      let totalCost = 0;
      const cellAreaM2 = 25; // Cella 5x5 metri

      cellsMap.forEach(c => {
        baseScore += (c.eco_score || 0);
        const spec = TOOL_SPECS[c.stato_progetto];
        if (spec && spec.costPerM2) {
          totalCost += (spec.costPerM2 * cellAreaM2);
        }
      });

      const corridorLinks = calculateConnectivity();
      const bonusScore = corridorLinks * 5;
      const finalScore = baseScore + bonusScore;

      document.getElementById('corridor-score').innerText = `Corridoi: ${corridorLinks} link (+${bonusScore} PT)`;
      document.getElementById('total-score').innerText = `Bio-Punti: ${finalScore} PT`;
      document.getElementById('total-cost').innerText = `Costo: ${totalCost.toLocaleString('it-IT')} €`;
    }

    // Supabase Multiutente in Tempo Reale
    function setupRealtime() {
      dbClient
        .channel('schema-db-changes')
        .on(
          'postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'celle_territorio' },
          (payload) => {
            const updated = payload.new;
            if (cellsMap.has(String(updated.cell_id))) {
              const cell = cellsMap.get(String(updated.cell_id));
              cell.stato_progetto = updated.stato_progetto;
              cell.eco_score = updated.eco_score;
              renderCells();
              updateMetrics();
            }
          }
        )
        .subscribe();
    }

    // Esportazione GeoJSON
    document.getElementById('export-geojson-btn').addEventListener('click', () => {
      const geojsonData = buildGeoJSON();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geojsonData));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "progetto_openlandscape.geojson");
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    map.on('load', () => {
      fetchViewportCells();
      setupRealtime();
    });

    // Ricarica dinamica al pan/zoom della mappa
    map.on('moveend', () => {
      fetchViewportCells();
    });
  </script>
</body>
</html>
